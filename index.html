<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사용설명서</title>
<style>
@font-face{font-family:"SUITE";font-weight:500;src:url("fonts/SUITE-Medium.woff") format("woff")} @font-face{font-family:"SUITE";font-weight:800;src:url("fonts/SUITE-ExtraBold.woff") format("woff")} body{font-family:"SUITE",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
:root{--bg:#fff;--fg:#327ddc;--muted:#327ddc;--line:#327ddc;--soft:#f3f3f3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:#000;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:500;line-height:1.6;word-break:keep-all}
a{color:inherit}
h1,h2,nav a{font-weight:800}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.top{padding:0;margin-bottom:56px}
.top img{display:block;height:44px;width:auto}
.hero{padding:32px 0 56px;background:linear-gradient(to bottom,#327ddc,#6ba5e9);color:#fff}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.2;margin:0 0 16px;letter-spacing:-.02em}
.hero p{margin:0 0 28px;color:#fff;font-size:18px;max-width:34em}
.search{display:block;width:100%;max-width:520px;font:inherit;font-size:16px;padding:14px 16px;border:2px solid #fff;border-radius:0;background:#fff;color:#000}
.hero .search:focus-visible,.hero a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.search:focus-visible,a:focus-visible{outline:3px solid #327ddc;outline-offset:3px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-top:1px solid #327ddc;border-bottom:1px solid #327ddc;z-index:5}
nav ul{list-style:none;margin:0;padding:0;display:flex;overflow-x:auto}
nav a{display:block;padding:16px 20px;text-decoration:none;white-space:nowrap;color:#327ddc}
nav a:hover{background:#327ddc;color:#fff}
section{padding:56px 0 8px}
.head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #327ddc;padding-bottom:12px;margin-bottom:24px}
.head h2{margin:0;font-size:28px;letter-spacing:-.01em;color:#327ddc}
.head span{color:#327ddc;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.card{border:1px solid #ddd;display:flex;flex-direction:column}
.img{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #ddd;overflow:hidden}
.img img{width:100%;height:100%;object-fit:contain}
.img svg{width:72px;height:72px;stroke:var(--fg);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.body{padding:16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{margin:0;font-size:18px;font-weight:800}
.body .model{color:#000;font-size:14px;margin:0 0 14px}
.btn{margin-top:auto;display:block;text-align:center;background:var(--fg);color:#fff;text-decoration:none;padding:12px;font-weight:500;border:2px solid var(--fg)}
.btn:hover{background:#fff;color:var(--fg)}
.empty{display:none;padding:64px 0;text-align:center;color:var(--muted)}
.cs{margin-top:10px;font-size:24px;font-weight:800;line-height:1.3}
footer{margin-top:72px;border-top:1px solid #000;padding:28px 0 40px;color:#555;font-size:14px}
.loading{padding:40px 0;color:#327ddc}
@media(max-width:600px){.wrap{padding:0 16px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.body{padding:12px}.body h3{font-size:16px}.body .model{font-size:12px;overflow-wrap:anywhere}.btn{padding:10px 4px;font-size:14px}.head h2{font-size:24px}section{padding-top:40px}nav a{padding:14px 14px;font-size:15px}.hero p{font-size:16px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="top"><a href="#" aria-label="Quming 홈"><img src="images/logo.png" alt="Quming"></a></div>
  <h1>사용설명서</h1>
  <p>제품을 선택하거나 제품명 또는 모델명을 검색해 사용설명서를 확인하세요.</p>
  <input class="search" id="q" type="search" placeholder="제품명 또는 모델명 검색" aria-label="제품 검색">
</div></header>
<nav aria-label="제품군"><div class="wrap"><ul id="nav"></ul></div></nav>
<main class="wrap" id="main"><p class="loading">불러오는 중...</p></main>
<p class="empty wrap" id="empty">검색 결과가 없습니다. 다른 모델명으로 검색해 보세요.</p>
<footer><div class="wrap">찾으시는 제품의 사용설명서가 없을 경우 고객만족센터로 문의해 주세요.<div class="cs">고객만족센터 1800-8888</div></div></footer>

<!-- ▼▼▼ 이 주소만 구글 스프레드시트 CSV 게시 링크로 바꿔주세요 ▼▼▼ -->
<script>const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbJd8Sx6G6G_eu-_dhz8B2RwYUMqLtoZrVY4NWhzgAYrNdKQFjsrF5PB6wXb-N7OrTlhS0sc1s6i3v/pub?gid=1349063332&single=true&output=csv";</script>
<!-- ▲▲▲ -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const ICONS={
  '직수형 정수기':'<path d="M12 3c3.5 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.500 2.500-6.500 6-11z"/>',
  '일반형 정수기':'<path d="M12 3c3.5 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.500 2.500-6.500 6-11z"/>',
  '공기청정기':'<path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h8"/>',
  '비데/샤워필터':'<path d="M4 6a6 6 0 0 1 12 0v2H4zM7 12v2M10 12v3M13 12v2M5 19v1M9 19v1M13 19v1"/>',
  '커피머신':'<path d="M5 9h11v5a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3"/>',
  '기타':'<rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18M7 7.500h.01M11 7.500h.01"/>'
};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main=document.getElementById('main');
const navEl=document.getElementById('nav');
let CATS=[]; // [{name, items:[...]}]

function group(rows){
  const order=[]; const map={};
  rows.forEach(r=>{
    const cat=(r['분류']||'').trim();
    const name=(r['제품명']||'').trim();
    if(!cat||!name) return;
    if(!map[cat]){ map[cat]={name:cat, items:[]}; order.push(cat); }
    map[cat].items.push({
      name, model:(r['모델명']||'').trim(),
      url:(r['사용설명서URL']||'#').trim(),
      img:(r['이미지파일명']||'').trim()
    });
  });
  return order.map(c=>map[c]);
}

function render(term){
  const t=(term||'').trim().toLowerCase(); let shown=0;
  main.innerHTML = CATS.map(c=>{
    const list=c.items.filter(i=>!t||(i.name+' '+i.model+' '+c.name).toLowerCase().includes(t));
    if(!list.length) return '';
    shown+=list.length;
    const id='cat-'+c.name.replace(/[^a-zA-Z0-9가-힣]/g,'');
    return `<section id="${id}"><div class="head"><h2>${esc(c.name)}</h2><span>${list.length}개 제품</span></div><div class="grid">`+
      list.map(i=>`<article class="card"><div class="img">${i.img?`<img src="images/${esc(i.img)}" alt="${esc(i.name)}" loading="lazy">`:`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[c.name]||''}</svg>`}</div><div class="body"><h3>${esc(i.name)}</h3><p class="model">${esc(i.model)||'&nbsp;'}</p><a class="btn" href="${esc(i.url)}" target="_blank" rel="noopener">사용설명서 보기</a></div></article>`).join('')+
      `</div></section>`;
  }).join('');
  document.getElementById('empty').style.display = shown ? 'none' : 'block';
}

function buildNav(){
  navEl.innerHTML = CATS.map(c=>{
    const id='cat-'+c.name.replace(/[^a-zA-Z0-9가-힣]/g,'');
    return `<li><a href="#${id}">${esc(c.name)}</a></li>`;
  }).join('');
}

document.getElementById('q').addEventListener('input', e=>render(e.target.value));

Papa.parse(CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results){
    CATS = group(results.data);
    buildNav();
    render('');
  },
  error: function(err){
    main.innerHTML = '<p class="loading">데이터를 불러오지 못했어요. CSV_URL 주소를 확인해 주세요.</p>';
    console.error(err);
  }
});
</script>
</body>
</html>
